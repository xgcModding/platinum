name: Steam Deck mouse fix - manual AppImage build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Build Linux x86_64 AppImage
    # Avoid ubuntu-latest moving to a different OS during this experiment.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:latest
    steps:
      - name: Install build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git python python-pip ninja meson cmake pkgconf \
            wget curl tar xz unzip ca-certificates nodejs \
            qt6-base qt6-wayland qt6-svg sdl2-compat sdl3 enet \
            dbus libffi libpng libglvnd libxkbcommon wayland \
            libx11 libxext libxcursor libxi libxfixes libxrandr libxrender libxss \
            libpulse alsa-lib patchelf squashfs-tools fuse2 openssl

      - name: Checkout patched repository (Node.js 24)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show toolchain and plugin availability
        shell: bash
        run: |
          # Create an artifact-worthy log before testing any build tools.
          # A diagnostic failure (e.g. missing command) must not leave us
          # with the misleading "No files were found" upload warning.
          set -uo pipefail
          : > build-linux.log
          (
            set -euo pipefail
            # Arch Linux installs qtpaths6 here, not necessarily on PATH.
            export PATH="/usr/lib/qt6/bin:$PATH"
            echo '/usr/lib/qt6/bin' >> "$GITHUB_PATH"
            printf 'Operating system:\n'
            cat /etc/os-release
            printf '\nBuild tools and PATH:\n'
            printf 'PATH=%s\n' "$PATH"
            gcc --version
            python3 --version
            ninja --version
            make --version
            pkg-config --modversion sdl2 Qt6Widgets libffi libenet
            printf '\nENet linker preflight:\n'
            pacman -Q enet
            pkg-config --libs libenet
            if ! test -f /usr/lib/libenet.so; then
              echo 'ERROR: Arch enet library missing from /usr/lib/libenet.so' >&2
              exit 1
            fi
            # libntr uses find_library('enet'); test that exact -lenet lookup.
            printf 'int main(void) { return 0; }\n' | gcc -x c - -o /tmp/pokeplatinum-enet-link-check -lenet
            rm -f /tmp/pokeplatinum-enet-link-check
            echo 'ENet compiler/linker preflight passed.'
            printf '\nQt tools and plugin locations:\n'
            if ! command -v qtpaths6 >/dev/null 2>&1; then
              echo 'ERROR: qtpaths6 is not installed in /usr/lib/qt6/bin or on PATH.' >&2
              exit 127
            fi
            command -v qtpaths6
            qt_plugins="$(qtpaths6 --query QT_INSTALL_PLUGINS)"
            printf 'Qt plugins directory: %s\n' "$qt_plugins"
            for plugin in platforms/libqwayland.so platforms/libqxcb.so \
                          platformthemes/KDEPlasmaPlatformTheme6.so; do
              if test -f "${qt_plugins}/${plugin}"; then
                echo "present: ${plugin}"
              else
                echo "not installed: ${plugin}"
              fi
            done
          ) 2>&1 | tee -a build-linux.log
          diagnostic_status=${PIPESTATUS[0]}
          if [[ "$diagnostic_status" -ne 0 ]]; then
            echo "::error title=Toolchain diagnostics failed::Exit code ${diagnostic_status}; download the build-log artifact for details."
            exit "$diagnostic_status"
          fi

      - name: Build using the project's own Linux target
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -uo pipefail
          # Capture the full compiler/packager output and retain make's exit code.
          make linux 2>&1 | tee -a build-linux.log
          build_status=${PIPESTATUS[0]}
          if [[ "${build_status}" -ne 0 ]]; then
            echo '::group::Last 160 lines of failing build'
            tail -n 160 build-linux.log
            echo '::endgroup::'
            echo '::group::Potential errors (line-numbered)'
            grep -nEi '(^|[[:space:]])(error:|fatal error:|FAILED:|ninja:.*error|make: \*\*\*|Traceback|No such file|not found|permission denied|subproject.*failed)' build-linux.log | tail -n 90 || true
            echo '::endgroup::'
            echo "::error title=make linux failed::Exit code ${build_status}. Download pokeplatinum-linux-build-log from this run's Artifacts section for the original compiler error."
            printf '## Linux AppImage build failed\n\nExit code: `%s`. Download the `pokeplatinum-linux-build-log` artifact and inspect `build-linux.log` for the first actual error.\n' "${build_status}" >> "$GITHUB_STEP_SUMMARY"
            exit "${build_status}"
          fi
          if [[ ! -s build_linux/pokeplatinum.AppImage ]]; then
            echo '::error title=AppImage missing::Build exited successfully but build_linux/pokeplatinum.AppImage was not created.'
            exit 1
          fi

      - name: Upload build log and Meson diagnostics (even if build fails)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pokeplatinum-linux-build-log
          path: |
            build-linux.log
            .build/build_linux/meson-logs/meson-log.txt
            .build/build_linux/meson-logs/testlog.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test AppImage
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: pokeplatinum-steamdeck-mouse-test
          path: build_linux/pokeplatinum.AppImage
          if-no-files-found: error
          retention-days: 7
